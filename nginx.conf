# ── Kutubxona.uz — frontend + backend proxy ──────────────────────────────────
# Frontend va API bir xil origin'da turadi: CORS muammosi yo'q, WebSocket
# ham shu yerdan o'tadi.

# ── /media/ himoyasi ────────────────────────────────────────────────────────
# Fayllar faqat quyidagi hollarda beriladi:
#   1) so'rov saytimizdagi sahifadan kelgan (Referer mos)     → $media_ref_ok
#   2) mijoz IP'si ruxsat ro'yxatida (.env: MEDIA_ALLOWED_IPS) → $media_ip_ok
# Hamkorlar fayllarni /api/partner/.../file/ orqali (token bilan) oladi —
# ular bu yerdan o'tmaydi.
#
# .env misoli:
#   MEDIA_ALLOWED_HOSTS=journal\.kutubxona\.uz|localhost|127\.0\.0\.1
#   MEDIA_ALLOWED_IPS=1\.2\.3\.4|5\.6\.7\.8
#   MEDIA_GUARD=on          (off qilsangiz tekshiruv umuman ishlamaydi)

map $http_referer $media_ref_ok {
    default 0;
    "~*^https?://([a-z0-9-]+\.)*(${MEDIA_ALLOWED_HOSTS})(:[0-9]+)?/" 1;
}

map $remote_addr $media_ip_ok {
    default 0;
    "~^(${MEDIA_ALLOWED_IPS})$" 1;
}

map "$media_ref_ok$media_ip_ok" $media_blocked {
    default 1;
    "~1"    0;      # ikkalasidan biri 1 bo'lsa — ruxsat
}

# MEDIA_GUARD=off bo'lsa tekshiruv o'chadi
map "${MEDIA_GUARD}$media_blocked" $media_deny {
    default 0;
    "on1"   1;
}

# ── Qidiruv botlari ─────────────────────────────────────────────────────────
# Sayt SPA, botlar esa JavaScript'ni bajarmaydi (Google Scholar, havola ko'rinishlari).
# Ularga Django shu sahifaning server HTML'ini beradi (apps/articles/seo.py).
map $http_user_agent $seo_bot {
    default 0;
    "~*(googlebot|google-inspectiontool|scholar|bingbot|yandex|duckduckbot|baiduspider|applebot|semanticscholar|telegrambot|twitterbot|facebookexternalhit|linkedinbot|slackbot|whatsapp|discordbot)" 1;
}

# Server nginx ortida turganda asl protokol saqlansin (aks holda havolalar http:// bo'lib qoladi)
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

upstream backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # PDF/DOCX yuklashlar uchun (backend cheklovi 50 MB)
    client_max_body_size 60m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml text/xml image/svg+xml font/woff font/woff2;

    # ── WebSocket: real-time chat ────────────────────────────────────────────
    location /ws/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        # Ulanish uzoq turadi — timeout'ni kattalashtiramiz
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── API + Django admin ───────────────────────────────────────────────────
    # /admin/* — React admin paneli (SPA). Django admin API domenida: <api>/admin/
    location ~ ^/api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_set_header   Connection        "";
        proxy_read_timeout 300s;          # AI extract / PDF parse uzoq davom etadi
        proxy_send_timeout 300s;
    }

    # ── robots.txt va sitemap.xml — Django (SITE_URL bo'yicha) ───────────────
    location = /robots.txt {
        proxy_pass       http://backend/api/seo/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
    location = /sitemap.xml {
        proxy_pass       http://backend/api/seo/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # ── Botlar uchun server HTML (ichki yo'l) ────────────────────────────────
    location ^~ /__seo/ {
        internal;
        rewrite ^/__seo/(.*)$ /api/seo/$1 break;
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_set_header   Connection        "";
    }

    # ── Django static (admin panel CSS/JS — whitenoise beradi) ───────────────
    location /static/ {
        proxy_pass       http://backend;
        proxy_set_header Host $host;
    }

    # ── Media fayllar ───────────────────────────────────────────────────────
    # Hamma media bir xil emas:
    #   • Rasmlar (muqova, avatar, maqola rasmi) OCHIQ qoladi — aks holda
    #     Telegram/Facebook havola ko'rinishlari (og:image) buziladi: ular
    #     Referer yubormasdan so'raydi.
    #   • Hujjatlar va chat fayllari HIMOYALANGAN — faqat saytimizdagi
    #     sahifadan yoki ruxsat etilgan IP dan ochiladi.

    # Parser ajratgan muallif rasmlari — ochiq (regexdan oldin ushlanadi)
    location ^~ /media/parsed/photos/ {
        root /var/www;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Himoyalangan: maqola manbalari, topshiriqlar, jurnal PDF'lari, chat
    location ~ ^/media/(articles/sources|submissions|journals/pdfs|parsed|chat)/ {
        if ($media_deny) { return 403; }

        root /var/www;
        access_log off;
        expires 7d;
        add_header Cache-Control "private";
        # PDF'ni iframe ichida ko'rsatish uchun
        add_header X-Frame-Options "SAMEORIGIN";
        try_files $uri =404;
    }

    # Qolgan media — ochiq rasmlar (avatar, muqova, maqola rasmi)
    location /media/ {
        root /var/www;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Frame-Options "SAMEORIGIN";
        try_files $uri =404;
    }

    # ── SPA: hashlangan asset'lar uzoq keshlanadi ───────────────────────────
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── SPA marshrutlari ─────────────────────────────────────────────────────
    # Faqat ilovada bor manzillar 200 qaytaradi. Qolgani pastda haqiqiy 404 oladi
    # (React o'sha index.html ichida «Sahifa topilmadi» ni ko'rsatadi) — soft 404 yo'q.
    location = / {
        if ($seo_bot) { rewrite ^ /__seo/home last; }
        rewrite ^ /index.html last;
    }
    location ~ ^/(articles|archive|authors)/[^/]+/?$ {
        if ($seo_bot) { rewrite ^/(articles|archive|authors)/([^/]+)/?$ /__seo/$1/$2 last; }
        rewrite ^ /index.html last;
    }
    location ~ ^/((articles|archive|authors|central-asia|login)|(central-asia|journals|issues)/[^/]+|about(/(board|policy|guide))?|admin(/.*)?)/?$ {
        rewrite ^ /index.html last;
    }

    # Statik fayllar (favicon, rasmlar); topilmasa — 404 + index.html
    location / {
        try_files $uri =404;
        error_page 404 =404 /index.html;
    }

    # index.html hech qachon keshlanmasin — yangi deploy darhol ko'rinsin
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
