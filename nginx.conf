# ── Kutubxona.uz — frontend + backend proxy ──────────────────────────────────
# Frontend va API bir xil origin'da turadi: CORS muammosi yo'q, WebSocket
# ham shu yerdan o'tadi.

# ── /media/ himoyasi ────────────────────────────────────────────────────────
# Fayllar faqat quyidagi hollarda beriladi:
#   1) so'rov saytimizdagi sahifadan kelgan (Referer mos)     → $media_ref_ok
#   2) mijoz IP'si ruxsat ro'yxatida (.env: MEDIA_ALLOWED_IPS) → $media_ip_ok
# Hamkorlar fayllarni /api/partner/.../file/ orqali (token bilan) oladi —
# ular bu yerdan o'tmaydi.
#
# .env misoli:
#   MEDIA_ALLOWED_HOSTS=journalkutubxona\.uz|localhost|127\.0\.0\.1
#   MEDIA_ALLOWED_IPS=1\.2\.3\.4|5\.6\.7\.8
#   MEDIA_GUARD=on          (off qilsangiz tekshiruv umuman ishlamaydi)

map $http_referer $media_ref_ok {
    default 0;
    "~*^https?://([a-z0-9-]+\.)*(${MEDIA_ALLOWED_HOSTS})(:[0-9]+)?/" 1;
}

map $remote_addr $media_ip_ok {
    default 0;
    "~^(${MEDIA_ALLOWED_IPS})$" 1;
}

map "$media_ref_ok$media_ip_ok" $media_blocked {
    default 1;
    "~1"    0;      # ikkalasidan biri 1 bo'lsa — ruxsat
}

# MEDIA_GUARD=off bo'lsa tekshiruv o'chadi
map "${MEDIA_GUARD}$media_blocked" $media_deny {
    default 0;
    "on1"   1;
}

upstream backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # PDF/DOCX yuklashlar uchun (backend cheklovi 50 MB)
    client_max_body_size 60m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml text/xml image/svg+xml font/woff font/woff2;

    # ── WebSocket: real-time chat ────────────────────────────────────────────
    location /ws/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Ulanish uzoq turadi — timeout'ni kattalashtiramiz
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── API + Django admin ───────────────────────────────────────────────────
    # /admin/* — React admin paneli (SPA). Django admin API domenida: <api>/admin/
    location ~ ^/api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 300s;          # AI extract / PDF parse uzoq davom etadi
        proxy_send_timeout 300s;
    }

    # ── Django static (admin panel CSS/JS — whitenoise beradi) ───────────────
    location /static/ {
        proxy_pass       http://backend;
        proxy_set_header Host $host;
    }

    # ── Media fayllar ───────────────────────────────────────────────────────
    # Hamma media bir xil emas:
    #   • Rasmlar (muqova, avatar, maqola rasmi) OCHIQ qoladi — aks holda
    #     Telegram/Facebook havola ko'rinishlari (og:image) buziladi: ular
    #     Referer yubormasdan so'raydi.
    #   • Hujjatlar va chat fayllari HIMOYALANGAN — faqat saytimizdagi
    #     sahifadan yoki ruxsat etilgan IP dan ochiladi.

    # Parser ajratgan muallif rasmlari — ochiq (regexdan oldin ushlanadi)
    location ^~ /media/parsed/photos/ {
        root /var/www;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Himoyalangan: maqola manbalari, topshiriqlar, jurnal PDF'lari, chat
    location ~ ^/media/(articles/sources|submissions|journals/pdfs|parsed|chat)/ {
        if ($media_deny) { return 403; }

        root /var/www;
        access_log off;
        expires 7d;
        add_header Cache-Control "private";
        # PDF'ni iframe ichida ko'rsatish uchun
        add_header X-Frame-Options "SAMEORIGIN";
        try_files $uri =404;
    }

    # Qolgan media — ochiq rasmlar (avatar, muqova, maqola rasmi)
    location /media/ {
        root /var/www;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Frame-Options "SAMEORIGIN";
        try_files $uri =404;
    }

    # ── SPA: hashlangan asset'lar uzoq keshlanadi ───────────────────────────
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # index.html hech qachon keshlanmasin — yangi deploy darhol ko'rinsin
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
